<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension Test</title>
  </head>

  <body>
    <h1>Extension Test Page</h1>

    <!-- Normal Image -->
    <img
      id="static-image"
      src="images/img_orange_flowers.jpg"
      alt="Orange Flowers"
    />

    <!-- Image with srcset -->
    <img
      id="srcset-image"
      src="images/img_orange_flowers.jpg"
      srcset="
        images/img_orange_flowers.jpg 100w,
        images/img_white_flower.jpg   214w,
        images/img_pink_flowers.jpg   460w
      "
      sizes="(min-width: 460px) 460px, 100px"
      alt="Responsive Flowers"
    />

    <!-- Picture element with sources -->
    <picture id="picture-container">
      <source media="(min-width: 650px)" srcset="images/img_pink_flowers.jpg" />
      <source media="(min-width: 465px)" srcset="images/img_white_flower.jpg" />
      <img
        id="picture-image"
        src="images/img_orange_flowers.jpg"
        alt="Flowers"
        style="width: auto"
      />
    </picture>

    <!-- Container for dynamic image -->
    <div id="dynamic-container"></div>

    <!-- 404 Image (should not be replaced) -->
    <img id="missing-image" src="non-existent.png" alt="Missing" />

    <script>
      // Add image dynamically after 1 second
      setTimeout(() => {
        const img = document.createElement("img");
        img.id = "dynamic-image";
        img.src = "images/img_white_flower.jpg";
        img.alt = "Dynamic Flower";
        document.getElementById("dynamic-container").appendChild(img);
      }, 1000);
    </script>
  </body>
</html>
